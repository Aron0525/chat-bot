name: Release APK

# 在线更新的供给端：推一个 v* tag，就构建出签名版 apk 并挂到 GitHub Release 上，
# 客户端（设置页「检查更新」）读的正是 releases/latest 里的 .apk 附件。
#
# 需要的仓库 Secrets（缺一个都会在第一步直接失败，不会悄悄发一个装不上的包）：
#   ANDROID_KEYSTORE_BASE64  keystore 文件的 base64（base64 -w0 release.jks）
#   ANDROID_STORE_PASSWORD   keystore 口令
#   ANDROID_KEY_ALIAS        别名
#   ANDROID_KEY_PASSWORD     别名口令
# 签名必须和已安装版本一致，否则 Android 会拒绝覆盖安装。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cn

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          VCODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n1)
          echo "tag=$TAG versionName=$VERSION versionCode=$VCODE"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag ($TAG) 和 app/build.gradle.kts 的 versionName (v$VERSION) 不一致，先改版本号再打 tag。"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VCODE" >> "$GITHUB_ENV"

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::仓库 Secrets 里缺少签名配置（ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD），不签名的包装不上，先配好再发版。"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keys/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keys/release.properties"
          echo "JEV_KEYSTORE_PROPS=$RUNNER_TEMP/keys/release.properties" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check the APK is actually signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "built: $APK"
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" | head -n5
          cp "$APK" "$RUNNER_TEMP/chat-bot-$APP_VERSION.apk"
          echo "APK_PATH=$RUNNER_TEMP/chat-bot-$APP_VERSION.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: chat-bot ${{ env.APP_VERSION }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
